<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tails — Screen 03 · Sign Up</title>
<link rel="stylesheet" href="../styles.css">
<style>
  .auth-head { display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 6px; }
  .auth-head .mini-mark { filter: drop-shadow(0 8px 18px rgba(26,111,255,0.35)); }
  .auth-title { margin-top: 12px; font-size: 25px; font-weight: 900; }
  .auth-sub { margin-top: 5px; font-size: 13.5px; font-weight: 600; color: var(--text-muted); }

  .social-row { display: flex; gap: 12px; }
  .social-btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 9px;
    padding: 13px 10px; border-radius: var(--radius-btn); cursor: pointer;
    background: var(--card); border: 1.5px solid var(--card-border);
    color: var(--text-white); font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800;
  }
  .social-btn:active { transform: scale(0.98); }
  .social-badge {
    width: 24px; height: 24px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    background: rgba(26,111,255,0.18); color: var(--blue-soft);
    font-size: 14px; font-weight: 900;
  }

  .divider { display: flex; align-items: center; gap: 12px; color: var(--text-muted); font-size: 12.5px; font-weight: 700; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.10); }

  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 52px; }
  .eye-btn {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 38px; height: 38px; border: none; border-radius: 10px; cursor: pointer;
    background: transparent; font-size: 18px; line-height: 1;
  }
  .strength { display: none; margin-top: 9px; }
  .strength.show { display: block; }
  .strength-bars { display: flex; gap: 5px; }
  .strength-bars span { flex: 1; height: 5px; border-radius: 99px; background: rgba(255,255,255,0.12); }
  .strength-bars span.f-gold { background: var(--gold); }
  .strength-bars span.f-blue { background: var(--blue); }
  .strength-label { margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--text-muted); }

  .tc-row { display: flex; align-items: flex-start; gap: 11px; cursor: pointer; padding: 2px 0; }
  .tc-row input { display: none; }
  .tc-box {
    width: 23px; height: 23px; flex: none; margin-top: 1px;
    border-radius: 7px; border: 1.5px solid var(--card-border);
    background: rgba(255,255,255,0.05);
    display: flex; align-items: center; justify-content: center;
    color: #231600; font-size: 14px; font-weight: 900;
  }
  .tc-row input:checked + .tc-box { background: var(--gold); border-color: var(--gold); }
  .tc-row input:checked + .tc-box::after { content: '✓'; }
  .tc-text { font-size: 13.5px; font-weight: 600; color: var(--text-muted); line-height: 1.45; }
  .tc-text b { color: var(--gold); font-weight: 800; }

  .free-badge {
    background: rgba(255,193,62,0.09); border: 1px solid rgba(255,193,62,0.38);
    border-radius: 20px; padding: 15px 16px; text-align: center;
  }
  .free-badge .fb-title { font-size: 14.5px; font-weight: 900; color: var(--gold); }
  .free-badge .fb-body { margin-top: 5px; font-size: 13px; font-weight: 700; color: var(--text-white); line-height: 1.5; }

  .auth-footer { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-bottom: 6px; }
  .auth-footer .have-account { font-size: 13.5px; font-weight: 600; color: var(--text-muted); }
  .auth-footer .have-account a { color: var(--gold); font-weight: 800; text-decoration: none; }
</style>
</head>
<body>
<div class="phone">
  <canvas id="starCanvas"></canvas>

  <div class="status-bar"><span>9:41</span><span class="status-dots">●●●</span></div>

  <div class="scroll-area no-shelf">

    <div class="auth-head">
      <!-- Small Tails mark: crescent + book -->
      <svg class="mini-mark" width="60" height="60" viewBox="0 0 200 200" fill="none" aria-label="Tails logo">
        <path d="M132 16a36 36 0 1 0 20 65 29 29 0 1 1-20-65z" fill="#FFC13E"/>
        <path d="M100 112c-15-11-36-15-54-11v52c18-4 39 0 54 11 15-11 36-15 54-11v-52c-18-4-39 0-54 11z" fill="#EAF2FF"/>
        <path d="M100 112c-15-11-36-15-54-11v52c18-4 39 0 54 11 15-11 36-15 54-11v-52c-18-4-39 0-54 11z" stroke="#1A6FFF" stroke-width="5" stroke-linejoin="round"/>
        <path d="M100 112v52" stroke="#1A6FFF" stroke-width="5"/>
        <path d="M100 166c-22 14-52 12-64-4" stroke="#1A6FFF" stroke-width="8" stroke-linecap="round"/>
      </svg>
      <div class="auth-title">Create Your Account</div>
      <div class="auth-sub">Free forever — upgrade anytime</div>
    </div>

    <div class="social-row">
      <button class="social-btn" onclick="handleSocial('Google')"><span class="social-badge">G</span>Google</button>
      <button class="social-btn" onclick="handleSocial('Apple')">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="#A9BEEA" aria-hidden="true"><path d="M16.7 12.9c0-2.4 2-3.6 2.1-3.7-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.9-1.6 0-3.1 1-4 2.4-1.7 2.9-.4 7.3 1.2 9.7.8 1.2 1.8 2.5 3 2.4 1.2 0 1.6-.8 3.1-.8s1.9.8 3.2.8c1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8-.1 0-2.6-1-2.7-3.7zM14.2 5.6c.7-.8 1.1-1.9 1-3-1 0-2.1.6-2.8 1.4-.6.7-1.2 1.9-1 3 1 .1 2.1-.6 2.8-1.4z"/></svg>
        Apple
      </button>
    </div>

    <div class="divider">or sign up with email</div>

    <div class="field">
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" placeholder="Your full name" autocomplete="name">
    </div>

    <div class="field">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="pw-wrap">
        <input type="password" id="password" placeholder="Min. 8 characters" autocomplete="new-password" oninput="checkStrength(this.value)">
        <button type="button" class="eye-btn" id="eyeBtn" onclick="togglePw()" aria-label="Show or hide password">👁️</button>
      </div>
      <div class="strength" id="strength">
        <div class="strength-bars"><span id="sb1"></span><span id="sb2"></span><span id="sb3"></span></div>
        <div class="strength-label" id="strengthLabel"></div>
      </div>
    </div>

    <label class="tc-row">
      <input type="checkbox" id="tc">
      <span class="tc-box"></span>
      <span class="tc-text">I agree to the <b>Terms of Service</b> and <b>Privacy Policy</b></span>
    </label>

    <button class="btn btn-gold" onclick="handleSignUp()">Create Free Account</button>

    <div class="free-badge">
      <div class="fb-title">🎁 Free Account Includes</div>
      <div class="fb-body">5 stories/month · 16 genres · 2 voices · Community access</div>
    </div>

    <div class="auth-footer">
      <div class="have-account">Already have an account? <a href="screen-04.html">Log In</a></div>
      <a class="btn btn-ghost" href="screen-05.html">👤 Continue as Guest</a>
    </div>

  </div>

  <script src="../js/stars.js"></script>
  <script src="../js/app.js"></script>
  <script>
    function handleSocial(p) { showToast(`${p} sign-in coming in the accounts phase ✨`, false); }

    function togglePw() {
      const pw = document.getElementById('password');
      const eye = document.getElementById('eyeBtn');
      const show = pw.type === 'password';
      pw.type = show ? 'text' : 'password';
      eye.textContent = show ? '🙈' : '👁️';
    }

    function checkStrength(v) {
      const box = document.getElementById('strength');
      const label = document.getElementById('strengthLabel');
      const bars = [document.getElementById('sb1'), document.getElementById('sb2'), document.getElementById('sb3')];
      bars.forEach(b => b.className = '');
      if (!v) { box.classList.remove('show'); return; }
      box.classList.add('show');
      let score = 0;
      if (v.length >= 8) score++;
      if (v.length >= 12 || /[0-9]/.test(v) && /[a-zA-Z]/.test(v)) score++;
      if (/[^a-zA-Z0-9]/.test(v) || (v.length >= 12 && /[0-9]/.test(v))) score++;
      score = Math.max(1, Math.min(3, score));
      const names = { 1: 'Weak', 2: 'Fair', 3: 'Strong' };
      for (let i = 0; i < score; i++) bars[i].className = score === 3 ? 'f-blue' : 'f-gold';
      label.textContent = `Password strength: ${names[score]}`;
    }

    function handleSignUp() {
      const name = document.getElementById('fullname').value.trim();
      const email = document.getElementById('email').value.trim();
      const pw = document.getElementById('password').value;
      if (!name) { showToast('Please enter your name', false); return; }
      if (!email.includes('@')) { showToast('Please enter a valid email', false); return; }
      if (pw.length < 8) { showToast('Password must be 8+ characters', false); return; }
      if (!document.getElementById('tc').checked) { showToast('Please accept the Terms & Privacy Policy', false); return; }
      showToast('Account created! Welcome 🎉', false);
      setTimeout(() => { location.href = 'screen-05.html'; }, 1200);
    }
  </script>
</div>
</body>
</html>

<link rel="stylesheet" href="../styles.css">
<style>
  .profile-head { text-align: center; padding-top: 10px; }
  .avatar {
    width: 76px; height: 76px; margin: 0 auto;
    border-radius: 50%;
    background: linear-gradient(160deg, var(--gold-light), var(--gold));
    color: #231600;
    display: flex; align-items: center; justify-content: center;
    font-size: 33px; font-weight: 900;
    box-shadow: 0 12px 28px rgba(255,193,62,0.35);
    border: 3px solid rgba(255,255,255,0.25);
  }
  .profile-name { font-size: 24px; font-weight: 900; margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 9px; }
  .profile-sub { color: var(--text-muted); font-size: 13.5px; font-weight: 700; margin-top: 5px; }
  .stats-row { display: flex; }
  .stat-cell { flex: 1; text-align: center; padding: 4px 2px; }
  .stat-cell + .stat-cell { border-left: 1px solid rgba(255,255,255,0.08); }
  .stat-val { font-size: 16.5px; font-weight: 900; }
  .stat-lab { font-size: 11px; color: var(--text-muted); font-weight: 700; margin-top: 2px; }
  .upgrade-banner {
    display: flex; align-items: center; gap: 13px;
    border: 1.5px solid rgba(255,193,62,0.55);
    background: linear-gradient(120deg, rgba(255,193,62,0.16), rgba(26,111,255,0.10));
    color: var(--text-white); text-decoration: none;
  }
  .upgrade-banner .u-title { font-size: 16.5px; font-weight: 900; color: var(--gold-light); }
  .upgrade-banner .u-sub { font-size: 13px; color: var(--text-white); font-weight: 600; opacity: 0.85; margin-top: 2px; }
  .menu-card { padding: 6px 16px; }
  .profile-foot { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 4px; }
  .version { font-size: 12px; color: var(--text-muted); font-weight: 600; }
</style>
</head>

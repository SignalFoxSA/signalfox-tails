<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tails — Screen 04 · Log In</title>
<link rel="stylesheet" href="../styles.css">
<style>
  .auth-head { display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 6px; }
  .auth-head .mini-mark { filter: drop-shadow(0 8px 18px rgba(26,111,255,0.35)); }
  .auth-title { margin-top: 12px; font-size: 25px; font-weight: 900; }
  .auth-sub { margin-top: 5px; font-size: 13.5px; font-weight: 600; color: var(--text-muted); }

  .social-row { display: flex; gap: 12px; }
  .social-btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 9px;
    padding: 13px 10px; border-radius: var(--radius-btn); cursor: pointer;
    background: var(--card); border: 1.5px solid var(--card-border);
    color: var(--text-white); font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800;
  }
  .social-btn:active { transform: scale(0.98); }
  .social-badge {
    width: 24px; height: 24px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    background: rgba(26,111,255,0.18); color: var(--blue-soft);
    font-size: 14px; font-weight: 900;
  }

  .divider { display: flex; align-items: center; gap: 12px; color: var(--text-muted); font-size: 12.5px; font-weight: 700; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.10); }

  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 52px; }
  .eye-btn {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 38px; height: 38px; border: none; border-radius: 10px; cursor: pointer;
    background: transparent; font-size: 18px; line-height: 1;
  }

  .login-row { display: flex; align-items: center; justify-content: space-between; }
  .remember { display: flex; align-items: center; gap: 10px; font-size: 13.5px; font-weight: 700; color: var(--text-muted); cursor: pointer; }
  .forgot {
    background: none; border: none; cursor: pointer; padding: 4px 0;
    color: var(--gold); font-family: 'Nunito', sans-serif; font-size: 13.5px; font-weight: 800;
  }

  .secured { text-align: center; font-size: 12px; font-weight: 600; color: var(--text-muted); }

  .auth-footer { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-bottom: 6px; }
  .auth-footer .no-account { font-size: 13.5px; font-weight: 600; color: var(--text-muted); }
  .auth-footer .no-account a { color: var(--gold); font-weight: 800; text-decoration: none; }
</style>
</head>
<body>
<div class="phone">
  <canvas id="starCanvas"></canvas>

  <div class="status-bar"><span>9:41</span><span class="status-dots">●●●</span></div>

  <div class="scroll-area no-shelf">

    <div class="auth-head">
      <!-- Small Tails mark: crescent + book -->
      <svg class="mini-mark" width="60" height="60" viewBox="0 0 200 200" fill="none" aria-label="Tails logo">
        <path d="M132 16a36 36 0 1 0 20 65 29 29 0 1 1-20-65z" fill="#FFC13E"/>
        <path d="M100 112c-15-11-36-15-54-11v52c18-4 39 0 54 11 15-11 36-15 54-11v-52c-18-4-39 0-54 11z" fill="#EAF2FF"/>
        <path d="M100 112c-15-11-36-15-54-11v52c18-4 39 0 54 11 15-11 36-15 54-11v-52c-18-4-39 0-54 11z" stroke="#1A6FFF" stroke-width="5" stroke-linejoin="round"/>
        <path d="M100 112v52" stroke="#1A6FFF" stroke-width="5"/>
        <path d="M100 166c-22 14-52 12-64-4" stroke="#1A6FFF" stroke-width="8" stroke-linecap="round"/>
      </svg>
      <div class="auth-title">Welcome Back</div>
      <div class="auth-sub">Log in to continue your story</div>
    </div>

    <div class="social-row">
      <button class="social-btn" onclick="handleSocial('Google')"><span class="social-badge">G</span>Google</button>
      <button class="social-btn" onclick="handleSocial('Apple')">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="#A9BEEA" aria-hidden="true"><path d="M16.7 12.9c0-2.4 2-3.6 2.1-3.7-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.9-1.6 0-3.1 1-4 2.4-1.7 2.9-.4 7.3 1.2 9.7.8 1.2 1.8 2.5 3 2.4 1.2 0 1.6-.8 3.1-.8s1.9.8 3.2.8c1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8-.1 0-2.6-1-2.7-3.7zM14.2 5.6c.7-.8 1.1-1.9 1-3-1 0-2.1.6-2.8 1.4-.6.7-1.2 1.9-1 3 1 .1 2.1-.6 2.8-1.4z"/></svg>
        Apple
      </button>
    </div>

    <div class="divider">or log in with email</div>

    <div class="field">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="pw-wrap">
        <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
        <button type="button" class="eye-btn" id="eyeBtn" onclick="togglePw()" aria-label="Show or hide password">👁️</button>
      </div>
    </div>

    <div class="login-row">
      <label class="remember">
        <span class="toggle"><input type="checkbox" id="remember"><span class="track"></span></span>
        Remember me
      </label>
      <button class="forgot" onclick="showToast('Password reset arrives with real accounts', false)">Forgot Password?</button>
    </div>

    <button class="btn btn-gold" onclick="handleLogin()">Log In</button>

    <button class="btn btn-blue-outline" onclick="showToast('Biometric login coming soon 🔐', false)">Face ID / Touch ID</button>

    <div class="secured">🔒 Secured with 256-bit encryption</div>

    <div class="auth-footer">
      <div class="no-account">Don't have an account? <a href="screen-03.html">Sign Up</a></div>
      <a class="btn btn-ghost" href="screen-05.html">👤 Continue as Guest</a>
    </div>

  </div>

  <script src="../js/stars.js"></script>
  <script src="../js/app.js"></script>
  <script>
    function handleSocial(p) { showToast(`${p} sign-in coming in the accounts phase ✨`, false); }

    function togglePw() {
      const pw = document.getElementById('password');
      const eye = document.getElementById('eyeBtn');
      const show = pw.type === 'password';
      pw.type = show ? 'text' : 'password';
      eye.textContent = show ? '🙈' : '👁️';
    }

    function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const pw = document.getElementById('password').value;
      if (!email.includes('@')) { showToast('Please enter a valid email', false); return; }
      if (pw.length < 1) { showToast('Please enter your password', false); return; }
      showToast('Welcome back! 🎉', false);
      setTimeout(() => { location.href = 'screen-05.html'; }, 1200);
    }
  </script>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tails — Screen 09 · Voice Selection</title>
<link rel="stylesheet" href="../styles.css">
<style>
  .voice-row {
    display: flex; align-items: center; gap: 13px;
    cursor: pointer; transition: border-color 0.15s, background 0.15s;
  }
  .voice-row.selected { border-color: var(--blue); background: rgba(26,111,255,0.13); }
  .avatar {
    width: 48px; height: 48px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 900; color: #fff;
    background: linear-gradient(150deg, var(--navy-light), var(--blue));
    border: 1.5px solid rgba(255,255,255,0.18);
  }
  .voice-row.selected .avatar { background: linear-gradient(150deg, var(--gold-light), var(--gold)); color: #231600; }
  .v-main { flex: 1; min-width: 0; }
  .v-name { font-size: 15.5px; font-weight: 800; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .v-note { font-size: 12.5px; color: var(--text-muted); font-weight: 600; margin-top: 2px; }
  .preview-btn {
    width: 38px; height: 38px; border-radius: 50%; flex: none;
    background: rgba(255,255,255,0.07); border: 1px solid var(--card-border);
    color: var(--text-white); font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .preview-btn:active { transform: scale(0.94); }
  .radio {
    width: 22px; height: 22px; border-radius: 50%; flex: none;
    border: 2px solid rgba(255,255,255,0.35);
    display: flex; align-items: center; justify-content: center;
  }
  .voice-row.selected .radio { border-color: var(--gold); }
  .voice-row.selected .radio::after {
    content: ''; width: 11px; height: 11px; border-radius: 50%; background: var(--gold);
  }
  .clone-card { border-color: rgba(255,193,62,0.45); background: rgba(255,193,62,0.07); }
  .clone-title { font-size: 16.5px; font-weight: 900; }
  .clone-text { font-size: 13.5px; color: var(--text-muted); font-weight: 600; margin: 6px 0 14px; line-height: 1.5; }
</style>
</head>
<body>
<div class="phone">
  <canvas id="starCanvas"></canvas>

  <div class="status-bar"><span>9:41</span><span class="status-dots">●●●</span></div>

  <div class="screen-head">
    <a class="back-btn" href="screen-07.html">‹</a>
    <div>
      <div class="screen-title">Choose a Voice</div>
      <div class="screen-sub">10 preset voices · Free includes 2</div>
    </div>
  </div>

  <div class="scroll-area">
    <div id="voiceList" style="display:flex;flex-direction:column;gap:12px;"></div>

    <div class="card clone-card">
      <div class="clone-title">🎙️ Clone Your Own Voice <span class="pill">PREMIUM</span></div>
      <div class="clone-text">Record a short sample and tell stories in your own voice.</div>
      <button class="btn btn-gold" onclick="showToast('Voice cloning arrives with the voice-provider phase')">Start Cloning</button>
    </div>
  </div>

<nav class="shelf">
<a class="shelf-item" href="screen-05.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg><span>Home</span></a>
<a class="shelf-item" href="screen-11.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg><span>Library</span></a>
<a class="shelf-item shelf-create" href="screen-07.html"><span class="create-orb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 3v18M3 12h18"/></svg></span><span>Create</span></a>
<a class="shelf-item" href="screen-15.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.2 3.4-5 6.5-5s5.7 1.8 6.5 5"/><circle cx="17.5" cy="9" r="2.6"/><path d="M16 15.2c2.9.3 4.9 1.9 5.5 4.8"/></svg><span>Community</span></a>
<a class="shelf-item" href="screen-13.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.3-6 8-6s7 2 8 6"/></svg><span>Profile</span></a>
</nav>

  <script src="../js/stars.js"></script>
  <script src="../js/app.js"></script>
  <script>
    // Voice catalogue: Nova is the only voice named in the original.
    // The other 9 are DRAFT placeholders for Ian's edit pass (see REFERENCE-COPY.md).
    const voices = [
      { name: 'Nova',   note: 'Warm storyteller — the original Tails voice', tier: 'free',    pitch: 1.0,  rate: 1.0  },
      { name: 'Luna',   note: 'Soft, dreamy female',                         tier: 'free',    pitch: 1.1,  rate: 0.95 },
      { name: 'Atlas',  note: 'Deep, steady male',                           tier: 'premium', pitch: 0.7,  rate: 0.95 },
      { name: 'Milo',   note: 'Cheerful, playful',                           tier: 'premium', pitch: 1.3,  rate: 1.1  },
      { name: 'Ruby',   note: 'Warm, expressive female',                     tier: 'premium', pitch: 1.05, rate: 1.05 },
      { name: 'Echo',   note: 'Calm, mysterious',                            tier: 'premium', pitch: 0.9,  rate: 0.9  },
      { name: 'Sage',   note: 'Wise grandfather',                            tier: 'premium', pitch: 0.6,  rate: 0.85 },
      { name: 'Willow', note: 'Gentle, soothing female',                     tier: 'premium', pitch: 1.15, rate: 0.9  },
      { name: 'Bram',   note: 'Bold adventurer male',                        tier: 'premium', pitch: 0.8,  rate: 1.05 },
      { name: 'Pixie',  note: 'Bright, giggly character voice',              tier: 'premium', pitch: 1.5,  rate: 1.15 }
    ];

    let selected = localStorage.getItem('tails.voice') || 'Nova';
    if (!voices.some(v => v.name === selected && v.tier === 'free')) selected = 'Nova';

    const list = document.getElementById('voiceList');

    function render() {
      list.innerHTML = '';
      voices.forEach(v => {
        const row = document.createElement('div');
        row.className = 'card voice-row' + (v.name === selected ? ' selected' : '');
        row.innerHTML = `
          <div class="avatar">${v.name[0]}</div>
          <div class="v-main">
            <div class="v-name">${v.name} ${v.tier === 'free' ? '<span class="pill blue">FREE</span>' : '<span class="pill">PREMIUM</span>'}</div>
            <div class="v-note">${v.note}</div>
          </div>
          <button class="preview-btn" aria-label="Preview ${v.name}">▶</button>
          <div class="radio"></div>`;
        row.querySelector('.preview-btn').addEventListener('click', (e) => { e.stopPropagation(); preview(v); });
        row.addEventListener('click', () => selectVoice(v));
        list.appendChild(row);
      });
    }

    function preview(v) {
      if (!('speechSynthesis' in window)) {
        showToast('Voice preview is not available on this device yet');
        return;
      }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(`Hello, I'm ${v.name}. Let me tell you a story.`);
      u.pitch = v.pitch;
      u.rate = v.rate;
      speechSynthesis.speak(u);
    }

    function selectVoice(v) {
      // The demo user is on the Free tier: Premium voices stay locked.
      if (v.tier === 'premium') {
        showToast('Premium voice — upgrade to unlock');
        return;
      }
      selected = v.name;
      localStorage.setItem('tails.voice', v.name);
      render();
      showToast(`Voice set to ${v.name}`);
    }

    render();
  </script>
</div>
</body>
</html>
